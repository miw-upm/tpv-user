# Monta solo el API y reutiliza el contenedor de bases de datos
services:
  app:
    build: .
    container_name: tpv-user
    restart: always
    ports:
      - "8081:8081"
    environment:
      # host.docker.internal: ruta al localhost de la máquina anfitriona
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/tpvuser

#> docker compose up --build -d
