server:
  port: 8081

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/tpvuser
    username: postgres
    password: postgres
  security:
    oauth2:
      clients:
        client-id: client-id
        client-secret: client-secret
        redirect-uris:
          - http://localhost:8081/swagger-ui/oauth2-redirect.html
          - http://localhost:8082/swagger-ui/oauth2-redirect.html
        issuer: http://tpv-user
        api-client-id: api-client-id
        api-client-secret: api-client-secret

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/