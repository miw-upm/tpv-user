spring:
  application:
    name: tpv-user
  profiles:
  # Profile ----------------------------------------
    active: dev
  # ------------------------------------------------
  output:
    ansi:
      enabled: ALWAYS
  cache:
    type: none
  jackson:
    default-property-inclusion: NON_NULL
  jpa:
    open-in-view: false

info:
  app:
    artifact: "@project.artifactId@"
    version: "@project.version@"
    build: "@maven.build.timestamp@"

logging:
  level:
    root: WARN
    es.upm: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

miw:
  admin: admin
  mobile: 6
  password: 6
  oauth2:
    client-id: client-id
    client-secret: client-secret
    redirect-uri: http://localhost:8081/login/oauth2/code/cliente-oidc
    issuer: http://localhost:8081
    api-client-id: api-client-id
    api-client-secret: api-client-secret
