spring:
  application:
    name: tpv-user
  profiles:
    # Profile ----------------------------------------
    active: dev
  # ------------------------------------------------
  output:
    ansi:
      enabled: ALWAYS
  cache:
    type: none
  jackson:
    default-property-inclusion: NON_NULL
  jpa:
    open-in-view: false

info:
  app:
    artifact: "@project.artifactId@"
    version: "@project.version@"
    build: "@maven.build.timestamp@"
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

logging:
  level:
    root: WARN
    es.upm: DEBUG

eureka:
  instance:
    lease-renewal-interval-in-seconds: 20
    lease-expiration-duration-in-seconds: 60
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

miw:
  admin: admin
  mobile: 6
  password: 6
  oauth2:
    client-id: client-id
    client-secret: client-secret
    redirect-uris:
      - http://localhost:8081/swagger-ui/oauth2-redirect.html
      - http://localhost:8082/swagger-ui/oauth2-redirect.html
    issuer: http://tpv-user
    api-client-id: api-client-id
    api-client-secret: api-client-secret